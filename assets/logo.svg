<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.15)" />
    </filter>
  </defs>
  <g id="cloud-character" filter="url(#softGlow)">
    <!-- Cloud Body Fill & Stroke -->
    <path d="M 175 180 
             C 175 125, 235 115, 260 145 
             C 285 110, 350 130, 345 190 
             C 380 195, 395 240, 375 270 
             C 390 300, 360 345, 315 340 
             L 165 340 
             C 120 345, 95 300, 115 265 
             C 95 235, 115 190, 155 185 
             C 160 182, 168 180, 175 180 Z" 
          fill="#ffffff" 
          stroke="#111111" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Left Eye -->
    <ellipse cx="195" cy="265" rx="10" ry="12" fill="#111111" />
    <circle cx="192" cy="261" r="3.5" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="285" cy="265" rx="10" ry="12" fill="#111111" />
    <circle cx="282" cy="261" r="3.5" fill="#ffffff" />

    <!-- Cute Smiling Mouth -->
    <path d="M 225 264 Q 240 282 255 264" 
          fill="none" 
          stroke="#111111" 
          stroke-width="12" 
          stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g id="brand-text">
    <text x="105" y="425" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="currentColor" letter-spacing="-1">web</text>
    <text x="245" y="425" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#00AEEF" letter-spacing="-1">Craft</text>
  </g>
</svg>
